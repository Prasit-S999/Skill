<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ทักษะพนักงาน · Employee Skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Kanit:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#ffffff;
    --ink:#2b1414;
    --coral:#e6302c;
    --coral-deep:#b3211d;
    --sun:#ffdbdb;
    --sky:#ff9d9d;
    --grape:#c1272d;
    --leaf:#ff6b6b;
    --pink:#ffc9c9;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font-family:"Sarabun", sans-serif; font-size:16px;
  }
  .app{display:flex; min-height:100vh; flex-direction:column; position:relative;}
  @media(min-width:768px){ .app{flex-direction:row;} }

  /* Sidebar */
  .sidebar{
    width:100%; flex-shrink:0; background:var(--card); position:relative; z-index:1;
    border-bottom:1.5px solid var(--ink);
  }
  @media(min-width:768px){
    .sidebar{width:300px; border-bottom:none; border-right:1.5px solid var(--ink);}
  }
  .sidebar-header{padding:24px 22px 18px;}
  .mark-row{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .seal-dot{
    width:10px; height:10px; border-radius:50%; background:var(--coral); flex-shrink:0;
  }
  .eyebrow{font-size:13px; font-weight:600; letter-spacing:.08em; color:var(--coral-deep); text-transform:uppercase; margin:0;}
  .sidebar-title{font-family:"Kanit",sans-serif; font-size:34px; font-weight:700; margin:2px 0 0; color:#000000; line-height:1.1; letter-spacing:-.01em;}
  .emp-list{padding:6px 14px 10px; max-height:42vh; overflow-y:auto;}
  @media(min-width:768px){ .emp-list{max-height:calc(100vh - 160px);} }
  .emp-item{
    width:100%; display:flex; align-items:center; gap:11px; padding:10px 12px;
    border:1.5px solid transparent; border-radius:8px;
    background:none; cursor:pointer; text-align:left; color:var(--ink); font-family:inherit;
    margin-bottom:4px; transition:background .12s ease, border-color .12s ease;
  }
  .emp-item:hover{background:#fdf1f0;}
  .emp-item.active{background:#fdf1f0; border-color:var(--coral);}
  .avatar{width:44px; height:44px; border-radius:50%; object-fit:cover; flex-shrink:0; border:1.5px solid var(--ink);}
  .avatar-fallback{
    width:44px; height:44px; border-radius:50%; flex-shrink:0; display:flex;
    align-items:center; justify-content:center; font-size:15px; font-weight:600;
    color:#fff; border:1.5px solid var(--ink);
  }
  .emp-info{flex:1; min-width:0;}
  .emp-name{font-size:17px; font-weight:600; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .emp-pos{font-size:14px; margin:2px 0 0; color:#6b6b83; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .emp-avg{font-size:15px; font-weight:700; color:var(--coral-deep); flex-shrink:0;}
  .sidebar-footer{padding:12px 22px 22px;}

  .btn{
    font-family:"Sarabun",sans-serif; font-size:16px; cursor:pointer; border-radius:6px;
    padding:9px 18px; display:inline-flex; align-items:center; gap:6px; font-weight:600;
    border:1.5px solid var(--ink); transition:background .12s ease, box-shadow .12s ease;
    box-shadow:2px 2px 0 var(--ink); background:var(--card); color:var(--ink);
  }
  .btn:hover{box-shadow:3px 3px 0 var(--ink);}
  .btn:active{box-shadow:1px 1px 0 var(--ink);}
  .btn-outline{background:var(--card);}
  .btn-solid{background:var(--coral); color:#fff; border-color:var(--coral-deep);}
  .btn-full{width:100%; justify-content:center;}
  .icon-btn{
    width:32px; height:32px; border-radius:50%; border:1.5px solid var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--card);
    box-shadow:2px 2px 0 var(--ink);
  }

  /* Main */
  .main{flex:1; padding:26px 20px 48px; position:relative; z-index:1;}
  @media(min-width:768px){ .main{padding:44px 48px 60px;} }
  .profile-row{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:24px; flex-wrap:wrap;}
  .profile-left{display:flex; align-items:flex-start; gap:18px;}
  .photo-wrap{position:relative; flex-shrink:0;}
  .photo{
    width:150px; height:150px; border-radius:50%; object-fit:cover; border:3px solid var(--ink);
  }
  .photo-fallback{
    width:150px; height:150px; border-radius:50%; background:var(--pink);
    display:flex; align-items:center; justify-content:center; border:3px solid var(--ink);
    font-size:54px;
  }
  .upload-btn{
    position:absolute; bottom:-2px; right:-2px; background:var(--sun); color:var(--ink);
    border:1.5px solid var(--ink); box-shadow:2px 2px 0 var(--ink); font-size:15px;
    width:36px; height:36px;
  }
  .name-title{font-size:29px; font-weight:700; margin:4px 0 0; color:var(--ink);}
  .pos-text{font-size:17px; font-weight:500; color:var(--coral-deep); margin:6px 0 0;}
  .edit-input{
    display:block; border:none; border-bottom:1.5px solid var(--ink); outline:none;
    background:transparent; font-family:inherit; padding:3px 0; margin-bottom:3px; color:var(--ink);
  }
  .edit-input.name{font-size:23px; font-weight:600;}
  .edit-input.pos{font-size:16px; color:var(--coral-deep); font-weight:500;}
  .edit-input:focus{border-bottom-color:var(--coral);}
  .actions{display:flex; align-items:center; gap:8px;}

  .grid{display:grid; grid-template-columns:1fr; gap:26px;}
  @media(min-width:1024px){ .grid{grid-template-columns:3fr 2fr;} }

  .panel{
    background:var(--card); border:1.5px solid var(--ink); border-radius:10px; padding:22px;
    box-shadow:3px 3px 0 var(--ink);
  }

  .section-label-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
  .section-label{font-size:15px; font-weight:600; color:var(--ink); margin:0; display:flex; align-items:center; gap:6px; letter-spacing:.02em; text-transform:uppercase;}
  .section-label .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}

  .score-badge{
    display:flex; align-items:center; gap:10px; background:#fff; border:1.5px solid var(--ink);
    border-radius:8px; padding:6px 16px 6px 6px;
  }
  .score-circle{
    width:44px; height:44px; border-radius:50%; background:var(--coral); border:1.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:17px;
  }
  .score-text{font-size:14px; font-weight:600; color:var(--ink); line-height:1.3;}
  .score-text span{display:block; font-size:12.5px; font-weight:500; color:#6b6b83;}

  .chart-box{
    height:340px; display:flex; align-items:center; justify-content:center;
  }

  .add-link{
    background:#fff; border:1.5px solid var(--ink); border-radius:6px; padding:6px 14px;
    cursor:pointer; font-size:13.5px; color:var(--ink); font-weight:600;
    box-shadow:2px 2px 0 var(--ink);
  }
  .add-link:hover{box-shadow:3px 3px 0 var(--ink);}

  .comp-card{border:1.5px solid var(--ink); border-radius:8px; padding:12px 14px; margin-bottom:12px; background:#fffefb;}
  .comp-top{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;}
  .comp-name-row{display:flex; align-items:center; gap:8px; min-width:0; flex:1;}
  .comp-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0; border:1px solid var(--ink);}
  .comp-label{font-size:17px; font-weight:600; color:var(--ink); margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .comp-label-input{
    font-size:17px; font-weight:600; color:var(--ink); border:none; border-bottom:1.5px solid #ddd;
    outline:none; background:transparent; font-family:inherit; flex:1; min-width:0;
  }
  .comp-label-input:focus{border-bottom-color:var(--coral);}
  .comp-right{display:flex; align-items:center; gap:9px; flex-shrink:0;}
  .comp-score{font-size:16px; font-weight:700; color:var(--ink); width:26px; text-align:right;}
  .remove-btn{background:none; border:none; cursor:pointer; color:#b7b7c9; display:flex;}
  .remove-btn:hover{color:var(--coral-deep);}
  .bar-track{width:100%; height:8px; background:#f1eee3; border-radius:4px; overflow:hidden; border:1px solid var(--ink);}
  .bar-fill{height:100%; border-radius:4px;}
  #remarkInput{
    width:100%; min-height:110px; resize:vertical; border:1.5px solid var(--ink); border-radius:8px;
    padding:12px 14px; font-family:"Sarabun",sans-serif; font-size:16px; color:var(--ink);
    background:#fffefb; outline:none; line-height:1.6;
  }
  #remarkInput:focus{border-color:var(--coral); box-shadow:0 0 0 3px var(--shu-tint, #fdf1f0);}
  #remarkInput::placeholder{color:#a9a9b8;}
  input[type="range"]{width:100%; accent-color:#ff6b6b;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="mark-row">
        <span class="seal-dot"></span>
        <p class="eyebrow">Employee Skills</p>
      </div>
      <h1 class="sidebar-title">ทักษะพนักงาน</h1>
    </div>
    <nav class="emp-list" id="empList"></nav>
    <div class="sidebar-footer">
      <button class="btn btn-outline btn-full" id="addEmpBtn">+ เพิ่มพนักงาน</button>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn btn-outline" id="exportBtn" style="flex:1; font-size:13px; padding:8px 10px;" title="บันทึกข้อมูลทั้งหมดเป็นไฟล์ data.json สำหรับนำไปแทนที่ในโฟลเดอร์ก่อน push ขึ้น GitHub">ส่งออกไฟล์</button>
        <button class="btn btn-outline" id="importBtn" style="flex:1; font-size:13px; padding:8px 10px;" title="นำเข้าข้อมูลจากไฟล์ .json ที่เคยส่งออกไว้">นำเข้าไฟล์</button>
      </div>
      <input type="file" id="importFileInput" accept="application/json" class="hidden">
      <button class="btn btn-outline btn-full" id="syncFromJsonBtn" style="margin-top:8px; font-size:13px; padding:8px 10px;" title="ล้างข้อมูลที่แก้ค้างไว้ในเบราว์เซอร์นี้ แล้วดึงข้อมูลล่าสุดจากไฟล์ data.json ที่อยู่คู่กับ index.html">ซิงก์จาก data.json</button>
      <p style="font-size:11.5px; color:#9a9a9a; margin:10px 0 0; line-height:1.5;">ระหว่างแก้ไข ข้อมูลจะบันทึกอัตโนมัติไว้ในเบราว์เซอร์นี้ก่อน เมื่อพร้อมเผยแพร่ ให้กด "ส่งออกไฟล์" แล้วนำไฟล์ data.json ไปแทนที่ในโฟลเดอร์โปรเจกต์ก่อน commit/push ขึ้น GitHub</p>
    </div>
  </aside>

  <main class="main">
    <div class="profile-row">
      <div class="profile-left">
        <div class="photo-wrap">
          <img id="photoImg" class="photo hidden" alt="">
          <div id="photoFallback" class="photo-fallback">&#128100;</div>
          <button class="icon-btn upload-btn hidden" id="uploadBtn" title="อัปโหลดรูป">&#8593;</button>
          <input type="file" id="fileInput" accept="image/*" class="hidden">
        </div>
        <div>
          <div id="viewInfo">
            <h2 class="name-title" id="nameView"></h2>
            <p class="pos-text" id="posView"></p>
          </div>
          <div id="editInfo" class="hidden">
            <input class="edit-input name" id="nameEdit">
            <input class="edit-input pos" id="posEdit" placeholder="ชื่อเล่น">
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-outline" id="editToggleBtn">แก้ไข</button>
        <button class="icon-btn hidden" id="deleteEmpBtn" title="ลบพนักงาน">&#10005;</button>
      </div>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="section-label-row">
          <p class="section-label"><span class="dot" style="background:var(--coral);"></span>ขีดความสามารถโดยรวม</p>
          <div class="score-badge">
            <div class="score-circle" id="avgNum">0</div>
            <div class="score-text">คะแนนเฉลี่ย<span id="levelLabel"></span></div>
          </div>
        </div>
        <div class="chart-box">
          <svg id="radarSvg" viewBox="0 0 400 360" width="100%" height="100%"></svg>
        </div>
      </div>

      <div class="panel">
        <div class="section-label-row">
          <p class="section-label"><span class="dot" style="background:var(--sky);"></span>รายละเอียดหัวข้อ</p>
          <div style="display:flex; align-items:center; gap:8px;" id="copyControls">
            <select id="copySourceSelect" class="hidden" style="font-family:inherit; font-size:13px; border:1.5px solid var(--ink); border-radius:6px; padding:5px 8px; background:#fff; color:var(--ink);"></select>
            <button class="add-link hidden" id="copyTopicsBtn" title="คัดลอกหัวข้อทักษะจากพนักงานอื่น">คัดลอกหัวข้อ</button>
            <button class="add-link hidden" id="addCompBtn">+ เพิ่มหัวข้อ</button>
          </div>
        </div>
        <div id="compList"></div>
      </div>
    </div>

    <div class="panel" style="margin-top:26px;">
      <div class="section-label-row">
        <p class="section-label"><span class="dot" style="background:var(--grape);"></span>หมายเหตุ (Remark)</p>
      </div>
      <textarea id="remarkInput" placeholder="บันทึกข้อสังเกต จุดที่ต้องพัฒนา หรือข้อมูลเพิ่มเติมเกี่ยวกับพนักงานคนนี้..."></textarea>
    </div>
  </main>
</div>

<script>
const uid = () => Math.random().toString(36).slice(2, 9);
const PALETTE = ["#e6302c", "#b3211d", "#ff6b6b", "#8c1512", "#ff9d9d", "#c1272d", "#ff4d4d", "#7a1210"];

const STORAGE_KEY = "electricalSkillProfileData";

// ข้อมูลตั้งต้นสุดท้าย ใช้เฉพาะกรณีไม่มี localStorage และโหลด data.json ไม่ได้เท่านั้น
const fallbackSeedEmployees = [
  {
    id: uid(), name: "สมชาย พงษ์ไฟฟ้า", nickname: "ช่างชาย", photo: null,
    remark: "แข็งแรงเรื่องการเดินสายและความปลอดภัย ควรฝึกเพิ่มเรื่องความเร็วในการทำงานภายใต้เวลาจำกัด",
    competencies: [
      { id: uid(), label: "ความปลอดภัยในการทำงาน", score: 8 },
      { id: uid(), label: "การอ่านแบบวงจรไฟฟ้า", score: 7 },
      { id: uid(), label: "การเดินสายและติดตั้ง", score: 8 },
      { id: uid(), label: "การตรวจสอบและแก้ไขปัญหา", score: 6 },
      { id: uid(), label: "ความเรียบร้อยของงาน", score: 7 },
      { id: uid(), label: "ความเร็วในการทำงาน", score: 6 },
    ]
  },
  {
    id: uid(), name: "อรุณ เดินสายดี", nickname: "ช่างรุ่ง", photo: null,
    remark: "",
    competencies: [
      { id: uid(), label: "ความปลอดภัยในการทำงาน", score: 9 },
      { id: uid(), label: "การอ่านแบบวงจรไฟฟ้า", score: 6 },
      { id: uid(), label: "การเดินสายและติดตั้ง", score: 7 },
      { id: uid(), label: "การตรวจสอบและแก้ไขปัญหา", score: 8 },
      { id: uid(), label: "ความเรียบร้อยของงาน", score: 8 },
      { id: uid(), label: "ความเร็วในการทำงาน", score: 7 },
    ]
  }
];

function loadFromLocalStorage(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed) && parsed.length > 0) return parsed.map(emp => ({ remark: "", ...emp }));
    return null;
  } catch (err) {
    console.error("โหลดข้อมูลที่บันทึกไว้ไม่สำเร็จ:", err);
    return null;
  }
}

// โหลดข้อมูล "เผยแพร่" จาก data.json (ไฟล์ที่ commit ขึ้น GitHub คู่กับ index.html)
async function loadFromDataJson(){
  try {
    const res = await fetch("data.json", { cache: "no-store" });
    if (!res.ok) return null;
    const parsed = await res.json();
    if (Array.isArray(parsed) && parsed.length > 0) {
      return parsed.map(emp => ({ id: emp.id || uid(), remark: "", ...emp }));
    }
    return null;
  } catch (err) {
    // เปิดไฟล์แบบ file:// ตรงๆ เบราว์เซอร์บางตัวจะบล็อก fetch ไฟล์ในเครื่อง เป็นเรื่องปกติ
    console.warn("โหลด data.json ไม่สำเร็จ (ปกติถ้าเปิดไฟล์ตรงๆ โดยไม่ผ่าน server):", err);
    return null;
  }
}

function saveData(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(employees));
  } catch (err) {
    console.error("บันทึกข้อมูลไม่สำเร็จ:", err);
  }
}

let employees = [];
let selectedId = null;
let editMode = false;

async function initData(){
  // 1) ถ้ามีข้อมูลที่กำลังแก้ไขค้างอยู่ใน localStorage ของเบราว์เซอร์นี้ ให้ใช้อันนั้นก่อน (กันงานที่ยังไม่ได้ export หาย)
  const local = loadFromLocalStorage();
  if (local) {
    employees = local;
  } else {
    // 2) ไม่มีของค้าง -> ลองโหลดข้อมูล "เผยแพร่" จาก data.json (ไฟล์ที่อยู่คู่กับ index.html)
    const fromJson = await loadFromDataJson();
    employees = fromJson || fallbackSeedEmployees;
  }
  selectedId = employees[0].id;
  renderAll();
}

function getEmployee(){ return employees.find(e => e.id === selectedId); }
function avgOf(emp){ return emp.competencies.reduce((s,c)=>s+Number(c.score),0) / emp.competencies.length; }
function initials(name){
  const parts = name.trim().split(" ");
  return parts.length > 1 ? parts[0][0] + parts[1][0] : name.slice(0,2);
}
function levelLabel(avg){
  if (avg >= 8.5) return "ผู้เชี่ยวชาญ";
  if (avg >= 7) return "ชำนาญ";
  if (avg >= 5) return "พัฒนาได้ดี";
  return "เริ่มต้น";
}
function colorFor(index){ return PALETTE[index % PALETTE.length]; }

function renderSidebar(){
  const list = document.getElementById("empList");
  list.innerHTML = "";
  employees.forEach((emp, idx) => {
    const active = emp.id === selectedId;
    const avg = avgOf(emp).toFixed(1);
    const c = colorFor(idx);
    const item = document.createElement("button");
    item.className = "emp-item" + (active ? " active" : "");
    item.innerHTML = `
      ${emp.photo
        ? `<img src="${emp.photo}" class="avatar" alt="">`
        : `<div class="avatar-fallback" style="background:${c};">${initials(emp.name)}</div>`}
      <div class="emp-info">
        <p class="emp-name">${escapeHtml(emp.name)}</p>
        <p class="emp-pos">${escapeHtml(emp.nickname)}</p>
      </div>
      <span class="emp-avg">${avg}</span>
    `;
    item.onclick = () => { selectedId = emp.id; editMode = false; renderAll(); };
    list.appendChild(item);
  });
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

function renderProfile(){
  const emp = getEmployee();
  document.getElementById("viewInfo").classList.toggle("hidden", editMode);
  document.getElementById("editInfo").classList.toggle("hidden", !editMode);
  document.getElementById("uploadBtn").classList.toggle("hidden", !editMode);
  document.getElementById("deleteEmpBtn").classList.toggle("hidden", !(editMode && employees.length > 1));

  document.getElementById("nameView").textContent = emp.name;
  document.getElementById("posView").textContent = emp.nickname ? `ชื่อเล่น "${emp.nickname}"` : "";

  document.getElementById("nameEdit").value = emp.name;
  document.getElementById("posEdit").value = emp.nickname;

  const photoImg = document.getElementById("photoImg");
  const photoFallback = document.getElementById("photoFallback");
  if (emp.photo){
    photoImg.src = emp.photo;
    photoImg.classList.remove("hidden");
    photoFallback.classList.add("hidden");
  } else {
    photoImg.classList.add("hidden");
    photoFallback.classList.remove("hidden");
  }

  document.getElementById("editToggleBtn").textContent = editMode ? "เสร็จสิ้น" : "แก้ไข";
  document.getElementById("editToggleBtn").className = "btn " + (editMode ? "btn-solid" : "btn-outline");
}

function renderChart(){
  const emp = getEmployee();
  const avg = avgOf(emp);
  document.getElementById("avgNum").textContent = avg.toFixed(1);
  document.getElementById("levelLabel").textContent = levelLabel(avg);

  const svg = document.getElementById("radarSvg");
  const cx = 200, cy = 172, r = 122;
  const n = emp.competencies.length;
  const angleFor = i => (Math.PI * 2 * i / n) - Math.PI / 2;

  let s = "";
  for (let ring = 1; ring <= 4; ring++){
    const rr = r * ring / 4;
    let pts = [];
    for (let i = 0; i < n; i++){
      const a = angleFor(i);
      pts.push(`${cx + rr*Math.cos(a)},${cy + rr*Math.sin(a)}`);
    }
    s += `<polygon points="${pts.join(" ")}" fill="none" stroke="#eee6d3" stroke-width="2"/>`;
  }
  for (let i = 0; i < n; i++){
    const a = angleFor(i);
    const x2 = cx + r*Math.cos(a), y2 = cy + r*Math.sin(a);
    s += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#eee6d3" stroke-width="2"/>`;
    const lx = cx + (r+34)*Math.cos(a), ly = cy + (r+34)*Math.sin(a);
    let anchor = "middle";
    if (Math.cos(a) > 0.3) anchor = "start";
    else if (Math.cos(a) < -0.3) anchor = "end";
    s += `<text x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="14.5" font-family="Kanit, sans-serif" font-weight="600" fill="#2b1414" dominant-baseline="middle">${escapeXml(emp.competencies[i].label)}</text>`;
  }
  let dataPts = [];
  for (let i = 0; i < n; i++){
    const a = angleFor(i);
    const val = Number(emp.competencies[i].score) / 10 * r;
    dataPts.push(`${cx + val*Math.cos(a)},${cy + val*Math.sin(a)}`);
  }
  s += `<polygon points="${dataPts.join(" ")}" fill="#ff6b6b" fill-opacity="0.30" stroke="#22223b" stroke-width="3" stroke-linejoin="round"/>`;
  for (let i = 0; i < n; i++){
    const a = angleFor(i);
    const val = Number(emp.competencies[i].score) / 10 * r;
    const x = cx + val*Math.cos(a), y = cy + val*Math.sin(a);
    s += `<circle cx="${x}" cy="${y}" r="6" fill="${colorFor(i)}" stroke="#22223b" stroke-width="2"/>`;
  }

  svg.innerHTML = s;
}

function escapeXml(str){
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderCompetencies(){
  const emp = getEmployee();
  document.getElementById("addCompBtn").classList.toggle("hidden", !(editMode && emp.competencies.length < 8));

  const others = employees.filter(e => e.id !== emp.id);
  const showCopy = editMode && others.length > 0;
  const copySelect = document.getElementById("copySourceSelect");
  const copyBtn = document.getElementById("copyTopicsBtn");
  copySelect.classList.toggle("hidden", !showCopy);
  copyBtn.classList.toggle("hidden", !showCopy);
  if (showCopy) {
    copySelect.innerHTML = others.map(e => `<option value="${e.id}">${escapeHtml(e.name)}</option>`).join("");
  }

  const list = document.getElementById("compList");
  list.innerHTML = "";
  emp.competencies.forEach((c, idx) => {
    const card = document.createElement("div");
    card.className = "comp-card";
    const pct = (c.score / 10) * 100;
    const color = colorFor(idx);
    card.innerHTML = `
      <div class="comp-top">
        <div class="comp-name-row">
          <span class="comp-dot" style="background:${color};"></span>
          ${editMode
            ? `<input class="comp-label-input" value="${escapeHtml(c.label)}" data-id="${c.id}" data-field="label">`
            : `<p class="comp-label">${escapeHtml(c.label)}</p>`}
        </div>
        <div class="comp-right">
          <span class="comp-score">${c.score}</span>
          ${editMode && emp.competencies.length > 3
            ? `<button class="remove-btn" data-remove="${c.id}">&#10005;</button>` : ""}
        </div>
      </div>
      ${editMode
        ? `<input type="range" min="0" max="10" step="1" value="${c.score}" data-id="${c.id}" data-field="score">`
        : `<div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${color};"></div></div>`}
    `;
    list.appendChild(card);
  });

  list.querySelectorAll('input[data-field="label"]').forEach(inp => {
    inp.addEventListener("input", e => {
      const c = getEmployee().competencies.find(c => c.id === e.target.dataset.id);
      c.label = e.target.value;
      renderChart();
      renderSidebar();
      saveData();
    });
  });
  list.querySelectorAll('input[data-field="score"]').forEach(inp => {
    inp.addEventListener("input", e => {
      const c = getEmployee().competencies.find(c => c.id === e.target.dataset.id);
      c.score = Number(e.target.value);
      renderChart();
      renderSidebar();
      renderCompetencies();
      saveData();
    });
  });
  list.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener("click", e => {
      const emp = getEmployee();
      if (emp.competencies.length <= 3) return;
      emp.competencies = emp.competencies.filter(c => c.id !== e.target.dataset.remove);
      renderAll();
    });
  });
}

function renderRemark(){
  const emp = getEmployee();
  const el = document.getElementById("remarkInput");
  if (document.activeElement !== el) {
    el.value = emp.remark || "";
  }
}

function renderAll(){
  renderSidebar();
  renderProfile();
  renderChart();
  renderCompetencies();
  renderRemark();
  saveData();
}

document.getElementById("editToggleBtn").onclick = () => {
  editMode = !editMode;
  renderAll();
};

document.getElementById("nameEdit").addEventListener("input", e => { getEmployee().name = e.target.value; renderSidebar(); saveData(); });
document.getElementById("posEdit").addEventListener("input", e => { getEmployee().nickname = e.target.value; renderSidebar(); renderProfile(); saveData(); });

document.getElementById("uploadBtn").onclick = () => document.getElementById("fileInput").click();
document.getElementById("fileInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { getEmployee().photo = reader.result; renderAll(); };
  reader.readAsDataURL(file);
});

document.getElementById("addCompBtn").onclick = () => {
  const emp = getEmployee();
  if (emp.competencies.length >= 8) return;
  emp.competencies.push({ id: uid(), label: "หัวข้อใหม่", score: 5 });
  renderAll();
};

document.getElementById("copyTopicsBtn").onclick = () => {
  const sourceId = document.getElementById("copySourceSelect").value;
  const source = employees.find(e => e.id === sourceId);
  if (!source) return;
  const emp = getEmployee();
  emp.competencies = source.competencies.map(c => ({ id: uid(), label: c.label, score: 5 }));
  renderAll();
};

document.getElementById("addEmpBtn").onclick = () => {
  const current = getEmployee();
  const defaultTopics = [
    { label: "ความปลอดภัยในการทำงาน", score: 5 },
    { label: "การอ่านแบบวงจรไฟฟ้า", score: 5 },
    { label: "การเดินสายและติดตั้ง", score: 5 },
    { label: "การตรวจสอบและแก้ไขปัญหา", score: 5 },
    { label: "ความเรียบร้อยของงาน", score: 5 },
  ];
  const topics = current ? current.competencies.map(c => ({ label: c.label, score: 5 })) : defaultTopics;
  const newEmp = {
    id: uid(), name: "พนักงานใหม่", nickname: "เล่น", photo: null, remark: "",
    competencies: topics.map(t => ({ id: uid(), label: t.label, score: t.score })),
  };
  employees.push(newEmp);
  selectedId = newEmp.id;
  editMode = true;
  renderAll();
};

document.getElementById("deleteEmpBtn").onclick = () => {
  if (employees.length <= 1) return;
  employees = employees.filter(e => e.id !== selectedId);
  selectedId = employees[0].id;
  renderAll();
};

document.getElementById("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(employees, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "data.json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

document.getElementById("importBtn").onclick = () => document.getElementById("importFileInput").click();
document.getElementById("importFileInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!Array.isArray(parsed) || parsed.length === 0) throw new Error("รูปแบบไฟล์ไม่ถูกต้อง");
      employees = parsed.map(emp => ({ remark: "", ...emp }));
      selectedId = employees[0].id;
      editMode = false;
      renderAll();
    } catch (err) {
      alert("ไม่สามารถนำเข้าไฟล์นี้ได้ กรุณาตรวจสอบว่าเป็นไฟล์ .json ที่ส่งออกจากระบบนี้");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

document.getElementById("remarkInput").addEventListener("input", e => {
  getEmployee().remark = e.target.value;
  saveData();
});

document.getElementById("syncFromJsonBtn").onclick = async () => {
  const ok = confirm("การซิงก์จะล้างข้อมูลที่แก้ไขค้างไว้ในเบราว์เซอร์นี้ และดึงข้อมูลล่าสุดจากไฟล์ data.json แทน ยืนยันหรือไม่?");
  if (!ok) return;
  const fromJson = await loadFromDataJson();
  if (!fromJson) {
    alert("ไม่สามารถโหลดไฟล์ data.json ได้ ตรวจสอบว่าไฟล์ data.json อยู่ในโฟลเดอร์เดียวกับ index.html และถ้าเปิดไฟล์ตรงๆ (file://) อาจต้องเปิดผ่าน local server หรือ GitHub Pages แทน");
    return;
  }
  employees = fromJson;
  selectedId = employees[0].id;
  editMode = false;
  renderAll();
};

initData();
</script>
</body>
</html>
